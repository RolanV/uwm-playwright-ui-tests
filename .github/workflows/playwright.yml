name: Playwright Tests

on:
  push:
    branches: [main, master, developer]
  pull_request:
    branches: [main, master, developer]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chrome --with-deps

      - name: Run smoke tests
        run: npx playwright test --grep @smoke
        env:
          URL: ${{ secrets.URL }}
          CI: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failed traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-results
          path: test-results/
          retention-days: 7

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chrome --with-deps

      - name: Run regression tests
        run: npx playwright test --grep @regression
        env:
          URL: ${{ secrets.URL }}
          CI: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failed traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-results
          path: test-results/
          retention-days: 7